<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0052cc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />

  <!-- Thunderbird UI Representation -->
  
  <!-- Fake Header Row -->
  <rect x="16" y="16" width="96" height="12" rx="4" fill="#ffffff" fill-opacity="0.15" />
  <rect x="24" y="20" width="16" height="4" rx="2" fill="#ffffff" fill-opacity="0.4" />
  <rect x="46" y="20" width="24" height="4" rx="2" fill="#ffffff" fill-opacity="0.4" />

  <!-- Message Row 1 (Highlighting the excerpt feature) -->
  <rect x="16" y="36" width="96" height="32" rx="6" fill="#ffffff" />
  <!-- Unread dot -->
  <circle cx="32" cy="52" r="5" fill="#0a84ff" />
  <!-- Subject (Bold & Dark) -->
  <rect x="46" y="48" width="24" height="8" rx="4" fill="#333333" />
  <!-- Excerpt (Thin & Grey) -->
  <rect x="74" y="50" width="26" height="4" rx="2" fill="#999999" />

  <!-- Message Row 2 -->
  <rect x="16" y="76" width="96" height="32" rx="6" fill="#ffffff" />
  <!-- Read dot (dim/grey) -->
  <circle cx="32" cy="92" r="5" fill="#e0e0e0" />
  <!-- Subject (Bold & Dark) -->
  <rect x="46" y="88" width="36" height="8" rx="4" fill="#333333" />
  <!-- Excerpt (Thin & Grey) -->
  <rect x="86" y="90" width="14" height="4" rx="2" fill="#999999" />

</svg>
