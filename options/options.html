<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Message Excerpts preferences</title>
    <link rel="stylesheet" href="options.css">
    <script src="options.js" defer></script>
  </head>
  <body>
    <label>
      <input type="checkbox" id="excerptInThirdRow" aria-describedby="description" disabled>
      If cards layout with three rows is active, place message excerpt in third row
    </label>
    <p id="description">In two-row cards and Table View, excerpts stay next to the subject. Changes are saved automatically.</p>
    <p id="status" role="status"></p>
  </body>
</html>
